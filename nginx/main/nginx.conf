# The main nginx configuration, kept in the repository rather than taken from
# the image.
#
# There is exactly one reason for this file to exist: `stream {}` has to sit at
# the top level, and the image's own nginx.conf includes `conf.d/*.conf` from
# *inside* `http {}`. Port 443 now carries two different protocols — HTTPS for
# the site and TURN over TLS for the media relay — and only a stream listener
# can sort them apart by the name the client asked for.
#
# Everything above the stream block is the stock nginx.conf from
# `nginx:alpine`, copied verbatim so that a future image upgrade is a diff a
# person can read rather than a mystery. Loaded via `nginx -c`, and mounted as
# a **directory**: a single-file bind mount goes on pointing at the old inode
# after `git reset --hard` replaces the file, which is how config changes used
# to reach the disk and never reach nginx.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    # Logged separately from HTTP, because a connection that never becomes an
    # HTTP request — a TURN relay, or a client whose TLS handshake fails — has
    # nowhere else to appear. Without this the first question during an
    # incident, "did it even arrive?", has no answer.
    log_format  sni  '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                     'to=$upstream_addr status=$status bytes=$bytes_sent '
                     'duration=$session_time';
    access_log /var/log/nginx/stream.log sni;

    include /etc/nginx/stream.d/*.conf;
}
