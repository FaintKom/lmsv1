# Sorting port 443 by the name the client asked for.
#
# A school network that allows nothing but 443 is the whole reason this file
# exists. TURN over UDP 3478 and TURN over TCP 7881 already cover most
# restrictive networks; the ones that permit exactly one port do not care what
# the media server offers, and their pupils simply never see anybody.
#
# `ssl_preread` reads the SNI out of the ClientHello without decrypting it, so
# this listener does not need — and does not have — the site's private key.
#
# Issuing the certificate, installing the renewal hook and verifying the result
# are written down in specs/003-live-lesson-video/turn-tls-runbook.md. Read it
# before deploying this file: nginx refuses to start when an `ssl_certificate`
# is missing, so arriving here without /etc/nginx/ssl/turn/cert.pem takes the
# site down rather than degrading.

resolver 127.0.0.11 valid=10s;

map $ssl_preread_server_name $lms_443_upstream {
    # Only this one name goes to the relay. Everything else, including a client
    # that sends no SNI at all, is the site — which is what keeps a mistake in
    # this file from becoming an outage in the browser.
    turn.grasslms.online  127.0.0.1:8444;
    default               127.0.0.1:8443;
}

# The one place that owns 443 now.
server {
    listen 443;
    listen [::]:443;

    ssl_preread on;

    # Both upstreams are told who the client really is. Without this every
    # request would arrive from 127.0.0.1, and the rate limiter — which keys on
    # the caller's address — would count the whole internet as one visitor.
    proxy_protocol on;
    proxy_pass $lms_443_upstream;

    # A lesson is long, and a TURN relay holds its connection open for the
    # whole of it. The ten-minute default would cut a class in half.
    proxy_timeout 4h;
}

# TLS for the relay's name terminates here, and only here.
#
# The media server is handed plain TURN and told to advertise `turns://`
# anyway (`turn.external_tls` in livekit.yaml). One process holds a private
# key, one certificate renews, and the media container needs neither — which
# also means `livekit.yaml` stays identical between a laptop and production.
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;

    # Its own certificate, for this hostname alone. Adding `turn.` to the
    # site's bundle would tie the site's expiry to this name: on 2026-07-29 a
    # subdomain in the bundle failed validation and took the whole certificate
    # with it, and the site went dark. Two certificates cannot do that to each
    # other.
    ssl_certificate     /etc/nginx/ssl/turn/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/turn/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $turn_upstream lms-livekit-1:5349;
    proxy_pass $turn_upstream;
    proxy_timeout 4h;
}
