# docker-compose.qa.yml — ephemeral stack for CI and local QA runs.
# NOT shared with prod. tmpfs DB, no nginx/cloudflared, no backups.
#
# Always run with explicit project name so containers don't clash with the
# local dev/prod stack (which uses the default project name `lms`):
#     docker compose -f docker-compose.qa.yml up -d --build --wait
# (the top-level `name:` field below pins the project to `lms-qa`).
#
# ⚠️ `--build` is NOT optional locally. The frontend's /api/* rewrite target is
# baked in at BUILD time (see frontend/Dockerfile.qa), so a stale image keeps
# whatever target it was built with. On 2026-08-11 a local run without --build
# reused a 2026-05-22 image whose rewrite pointed at https://grasslms.online:
# every UI request from the "ephemeral" stack went to PRODUCTION, API-level
# tests passed, and every UI test failed with "Invalid email or password"
# because prod has no qa-* accounts. CI is unaffected (e2e.yml passes --build
# and runners start imageless), but locally the failure is silent and
# misleading. If UI tests fail while API tests pass, check this first:
#     docker compose -f docker-compose.qa.yml exec frontend \
#         grep -o 'https://[a-z.]*' .next/routes-manifest.json
#
# All POSTGRES_*/JWT_*/etc values are HARD-CODED rather than interpolated
# from .env.qa — the root .env (prod) shadows ${VAR:-default} substitution
# in compose YAML and broke DB auth in the first attempt. env_file: .env.qa
# still applies to container env vars (different mechanism, not shadowed).

name: lms-qa

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa-password-not-for-prod
      POSTGRES_DB: lms_qa
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # pgvector is shipped with the image but not enabled per-database;
      # this init script runs once at first start and creates the extension.
      - ./qa/init-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d lms_qa"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  sandbox:
    build: ./sandbox
    command: uvicorn runner.main:app --host 0.0.0.0 --port 8001
    # QA only. Every limit this service enforces is a container property, so its
    # tests have to reach the real container rather than an in-process copy.
    # Production and staging deliberately have no mapping: there the sandbox is
    # reachable only over sandbox-net, and only by the backend.
    ports:
      - "8101:8001"
    # PID 1 here is uvicorn, and uvicorn does not reap orphans. A fork bomb's
    # children are re-parented to it when their own parent dies, and a killed
    # orphan stays a zombie — still occupying a slot in the pids cgroup.
    #
    # Measured: after one fork bomb the container held 256 pids while `docker
    # top` showed a single live process, and every later submission was refused
    # for a limit somebody else had reached. pids_limit alone therefore turns
    # "the container dies" into "the container refuses everything forever",
    # which is not much of an improvement. Docker's init (tini) reaps them.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=100M
      # The one directory that permits execution: a binary our own compiler
      # just produced from the pupil's source. /tmp stays noexec, so four of
      # the five languages never gain the permission (research.md Finding A).
      # mode=1777 because the service no longer runs as root: the default
      # 755 root-owned mount left `runner` unable to write here, which is
      # where compiled languages put their binary. Sticky, like /tmp, so
      # one of the concurrent executions cannot delete another's directory.
      - /sandbox-exec:size=64M,exec,mode=1777
    security_opt:
      - "no-new-privileges:true"
      # Denies outbound connect() to every process in the container. The
      # runner never dials out; a pupil's program needs it to reach the
      # backend, which shares the sandbox network. See the profile for
      # what it deliberately does not deny, and why.
      - "seccomp=./sandbox/policies/seccomp.json"
    deploy:
      resources:
        limits:
          # A fork bomb is three lines and needs no skill. Without this cap it
          # exhausted the container's memory by sheer process count and the kernel
          # OOM-killed the container itself (exit 137) — measured, not assumed.
          #
          # 256 is arithmetic, not a round number: one Java program costs ~13 threads
          # (measured, research.md Finding G), four slots is the production bound, and
          # the runner rests at 6 — so the worst legitimate case is about 58. Four
          # times that leaves room for a language nobody has profiled yet, while a
          # fork bomb reaches thousands within a second.
          pids: 256
          cpus: "1.0"
          memory: 256M

  backend:
    build: ./backend
    env_file: .env.qa
    environment:
      DATABASE_URL: postgresql+asyncpg://qa:qa-password-not-for-prod@db:5432/lms_qa
      SANDBOX_URL: http://sandbox:8001
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Project's scripts/ and qa/ live outside the built image; mount them
      # in read-only so the backend container can run seed_qa.py against the
      # ephemeral DB without rebuilding the image when fixtures change.
      - ./scripts:/app/scripts:ro
      - ./qa:/app/qa:ro
      # Role-flow tests live in this repo but the backend image is built once
      # and may pre-date them. Mount the dir so `pytest tests/role_flows/`
      # picks up edits without a rebuild.
      - ./backend/tests/role_flows:/app/tests/role_flows:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # /health returns {"status": "ok", "ready": <bool>}. We require ready=true
      # so the QA stack is genuinely usable before tests start — a 200 with
      # ready=false hides a broken DB connection.
      test:
        - "CMD-SHELL"
        - "python -c 'import json,urllib.request,sys; r=urllib.request.urlopen(\"http://localhost:8000/health\"); d=json.load(r); sys.exit(0 if d.get(\"ready\") else 1)'"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  frontend:
    build:
      # Context is repo root so the build can COPY both frontend/ and qa/
      # (the registry imports qa/exercise-fixtures.json at typecheck time).
      # Dockerfile.qa exists separately so prod's `./frontend` context build
      # is unaffected.
      context: .
      dockerfile: frontend/Dockerfile.qa
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # Build-time, not runtime — see the comment in frontend/Dockerfile.qa.
        # Without it the /api/:path* rewrite never reaches routes-manifest.json
        # and the whole authenticated app 404s inside the QA stack.
        BACKEND_URL: http://backend:8000
    env_file: .env.qa
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      # node:22-alpine ships busybox wget. Use 127.0.0.1 explicitly because
      # busybox resolves `localhost` to IPv6 ::1 but Next.js binds IPv4 only.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
