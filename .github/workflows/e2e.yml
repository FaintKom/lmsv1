name: E2E

# End-to-end browser suite. Runs automatically on pull requests, and on demand
# for anything the gate deliberately leaves out.
#
# Until 2026-08-11 this was workflow_dispatch only, so the whole browser suite
# — auth, RBAC, role journeys, exercise lifecycle, live lessons and the eight
# functional journeys in e2e/journeys — ran only when a maintainer remembered
# to click it. Nobody did, and specs rotted quietly: one threw at module scope
# and aborted every other spec, another asserted a page deleted in May and
# passed anyway.
#
# The PR gate skips one suite, via an env flag read by playwright.config.ts:
#   E2E_SKIP_EXTERNAL — all-content-types drives real youtube.com and
#                       docs.google.com embeds; their outage is not our bug.
# It still runs in the manual dispatch.
#
# The dark-theme audit used to be skipped here too, as a non-blocking report,
# because it was finding real debt. That debt was paid on 2026-08-11, so it
# is part of the gate again.
#
# Why this is not a job in ci.yml:
#   The Playwright suite (frontend/e2e/all-content-types.spec.ts) drives real
#   third-party embeds — the YouTube IFrame API (youtube.com), a Google Slides
#   iframe (docs.google.com) — and heavy client editors (Monaco, KaTeX). Those
#   external resources are classic CI-flake sources: a transient youtube.com
#   slowdown would turn main red even though the app is fine. Per the team's
#   "green-or-manual, never flaky-red" rule we expose this as an on-demand run
#   a maintainer triggers (Actions tab -> "E2E (manual)" -> Run workflow), or
#   via `gh workflow run e2e.yml`.
#
# It stands up the ephemeral QA stack (docker-compose.qa.yml): tmpfs Postgres +
# redis + sandbox + backend + frontend, seeded by scripts/seed_qa.py with
# deterministic, committed, NON-prod accounts (qa-teacher@/qa-student@qa.example.com,
# password in seed_qa.py::QA_PASSWORD). No prod, no real secrets, nothing that
# can touch grasslms.online. Artifacts (Playwright HTML report + traces/videos)
# are uploaded on failure.

on:
  pull_request:
    # Only when something the suite actually exercises changed — a docs-only
    # PR should not spend ten minutes building the QA stack.
    paths:
      - "frontend/**"
      - "backend/**"
      - "qa/**"
      - "sandbox/**"
      - "scripts/seed_qa.py"
      - "docker-compose.qa.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright -g filter (e.g. 'quiz|file_upload'). Empty = no filter."
        required: false
        default: ""
      spec:
        description: "Spec path(s) to run. Empty = every e2e spec, not just all-content-types."
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (ephemeral QA stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Deterministic QA credentials — match scripts/seed_qa.py. NOT secrets.
    env:
      E2E_BASE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      E2E_TEACHER_EMAIL: qa-teacher@qa.example.com
      E2E_TEACHER_PASSWORD: qa-test-not-for-prod
      E2E_STUDENT_EMAIL: qa-student@qa.example.com
      E2E_STUDENT_PASSWORD: qa-test-not-for-prod

    steps:
      - uses: actions/checkout@v4

      - name: Build & start QA stack
        run: docker compose -f docker-compose.qa.yml up -d --build --wait

      - name: Show stack status
        if: always()
        run: docker compose -f docker-compose.qa.yml ps

      - name: Apply migrations
        run: docker compose -f docker-compose.qa.yml exec -T backend python -m alembic upgrade head

      - name: Seed deterministic QA data
        run: |
          # seed_qa.py prints QA_ORG_ID / QA_COURSE_ID / QA_LESSON_ID /
          # QA_EXERCISE_COUNT. all-content-types.spec.ts reads QA_LESSON_ID and
          # fails immediately without it, so forward them to later steps.
          docker compose -f docker-compose.qa.yml exec -T backend \
            python scripts/seed_qa.py | tee seed-output.txt
          grep -E '^QA_[A-Z_]+=' seed-output.txt >> "$GITHUB_ENV"

      - name: Wait for backend /health/ready
        run: |
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready || echo 000)
            if [ "$CODE" = "200" ]; then echo "backend ready"; exit 0; fi
            echo "attempt $i: /health/ready -> $CODE; retrying"; sleep 3
          done
          echo "::error::backend never became ready"; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (for Playwright runner)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          # On a PR this is the gate, so the two suites that cannot be green on
          # every PR are skipped here and handled separately below. A manual
          # dispatch leaves both empty and therefore runs everything.
          E2E_SKIP_EXTERNAL: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          # Default is now the whole e2e directory. Until 2026-08-03 this ran
          # all-content-types.spec.ts alone, so roles/, rbac, exercises and
          # live-lesson were written but never executed anywhere.
          SPEC="${{ github.event.inputs.spec }}"
          [ -n "$SPEC" ] || SPEC="e2e"
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            npx playwright test $SPEC -g "${{ github.event.inputs.grep }}" --workers=1
          else
            npx playwright test $SPEC --workers=1
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.qa.yml logs --tail=200 backend frontend

      - name: Tear down QA stack
        if: always()
        run: docker compose -f docker-compose.qa.yml down -v
