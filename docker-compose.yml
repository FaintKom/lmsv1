services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lms:lms_dev_password@db:5432/lms
      SANDBOX_URL: http://sandbox:8001
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
      - sandbox-net

  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - frontend-net

  sandbox:
    build: ./sandbox
    command: uvicorn runner.main:app --host 0.0.0.0 --port 8001
    # Egress-isolated (internal: true) so untrusted student code can't reach
    # the internet. Only backend (also on sandbox-net) can call it.
    networks:
      - sandbox-net
    deploy:
      resources:
        limits:
          # A fork bomb is three lines and needs no skill. Without this cap it
          # exhausted the container's memory by sheer process count and the kernel
          # OOM-killed the container itself (exit 137) — measured, not assumed.
          #
          # 256 is arithmetic, not a round number: one Java program costs ~13 threads
          # (measured, research.md Finding G), four slots is the production bound, and
          # the runner rests at 6 — so the worst legitimate case is about 58. Four
          # times that leaves room for a language nobody has profiled yet, while a
          # fork bomb reaches thousands within a second.
          pids: 256
          cpus: "2.0"
          memory: 512M
    # PID 1 here is uvicorn, and uvicorn does not reap orphans. A fork bomb's
    # children are re-parented to it when their own parent dies, and a killed
    # orphan stays a zombie — still occupying a slot in the pids cgroup.
    #
    # Measured: after one fork bomb the container held 256 pids while `docker
    # top` showed a single live process, and every later submission was refused
    # for a limit somebody else had reached. pids_limit alone therefore turns
    # "the container dies" into "the container refuses everything forever",
    # which is not much of an improvement. Docker's init (tini) reaps them.
    init: true
    security_opt:
      - "no-new-privileges:true"
      # Denies outbound connect() to every process in the container. The
      # runner never dials out; a pupil's program needs it to reach the
      # backend, which shares the sandbox network. See the profile for
      # what it deliberately does not deny, and why.
      - "seccomp=./sandbox/policies/seccomp.json"
    read_only: true
    tmpfs:
      - /tmp:size=100M
      # The one directory that permits execution: a binary our own compiler
      # just produced from the pupil's source. /tmp stays noexec, so four of
      # the five languages never gain the permission (research.md Finding A).
      # mode=1777 because the service no longer runs as root: the default
      # 755 root-owned mount left `runner` unable to write here, which is
      # where compiled languages put their binary. Sticky, like /tmp, so
      # one of the concurrent executions cannot delete another's directory.
      - /sandbox-exec:size=64M,exec,mode=1777

  livekit:
    # Pinned, never `:latest`. A moving tag means `docker compose up -d` can
    # recreate this container on any unrelated deploy, which cuts off whatever
    # lesson is running (research.md Finding I).
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # Development keys. Worthless, identical for everyone, and deliberately
      # in git — production reads real ones from its own environment.
      # LiveKit refuses secrets under 32 characters, so this is long rather
      # than memorable. It is worthless, identical for everyone, and the
      # server logs an error on anything shorter.
      LIVEKIT_KEYS: "devkey: local-development-secret-not-for-production"
    ports:
      - "7880:7880" # signalling (HTTP/WebSocket)
      - "7881:7881" # WebRTC over TCP, for networks that block UDP
      - "7882-7883:7882-7883/udp" # media, multiplexed (see livekit.yaml)
      - "3478:3478/udp" # embedded TURN, control connection
      - "30000-30020:30000-30020/udp" # TURN relay allocations — without these
        # the TURN server answers and then relays nothing
    networks:
      - backend-net
      - frontend-net

volumes:
  pgdata:

networks:
  backend-net:
  frontend-net:
  sandbox-net:
    internal: true
