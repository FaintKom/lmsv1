services:
  db:
    # pgvector/pgvector:pg16 is a drop-in replacement for postgres:16-alpine
    # (same PGDATA layout) that ships the `vector` extension's shared lib.
    # The DB has the `vector` extension + vector indexes (knowledge module);
    # plain postgres:16-alpine lacks vector.so, which breaks pg_dump (the
    # nightly backup silently failed for weeks). Keep this image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    # Built in CI (deploy.yml) and pulled from GHCR; `build:` kept only as
    # the transitional/manual fallback — the box must not build routinely.
    image: ghcr.io/faintkom/lmsv1-backend:latest
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms}
      SANDBOX_URL: http://sandbox:8001
      # Rate limiter persists counters in Redis so a redeploy doesn't
      # reset them. See app/common/rate_limit.py.
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    networks:
      - internal
      - sandbox-net
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  frontend:
    image: ghcr.io/faintkom/lmsv1-frontend:latest
    build: ./frontend
    networks:
      - internal
    restart: unless-stopped

  sandbox:
    image: ghcr.io/faintkom/lmsv1-sandbox:latest
    build: ./sandbox
    command: uvicorn runner.main:app --host 0.0.0.0 --port 8001
    # Egress-isolated network (internal: true) so untrusted student code
    # cannot reach the internet to exfiltrate data or phone home. Only the
    # backend (which also joins sandbox-net) can call it.
    networks:
      - sandbox-net
    deploy:
      resources:
        limits:
          # A fork bomb is three lines and needs no skill. Without this cap it
          # exhausted the container's memory by sheer process count and the kernel
          # OOM-killed the container itself (exit 137) — measured, not assumed.
          #
          # 256 is arithmetic, not a round number: one Java program costs ~13 threads
          # (measured, research.md Finding G), four slots is the production bound, and
          # the runner rests at 6 — so the worst legitimate case is about 58. Four
          # times that leaves room for a language nobody has profiled yet, while a
          # fork bomb reaches thousands within a second.
          pids: 256
          cpus: "2.0"
          memory: 512M
    # PID 1 here is uvicorn, and uvicorn does not reap orphans. A fork bomb's
    # children are re-parented to it when their own parent dies, and a killed
    # orphan stays a zombie — still occupying a slot in the pids cgroup.
    #
    # Measured: after one fork bomb the container held 256 pids while `docker
    # top` showed a single live process, and every later submission was refused
    # for a limit somebody else had reached. pids_limit alone therefore turns
    # "the container dies" into "the container refuses everything forever",
    # which is not much of an improvement. Docker's init (tini) reaps them.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=100M
      # The one directory that permits execution: a binary our own compiler
      # just produced from the pupil's source. /tmp stays noexec, so four of
      # the five languages never gain the permission (research.md Finding A).
      # mode=1777 because the service no longer runs as root: the default
      # 755 root-owned mount left `runner` unable to write here, which is
      # where compiled languages put their binary. Sticky, like /tmp, so
      # one of the concurrent executions cannot delete another's directory.
      - /sandbox-exec:size=64M,exec,mode=1777
    security_opt:
      - "no-new-privileges:true"
      # Denies outbound connect() to every process in the container. The
      # runner never dials out; a pupil's program needs it to reach the
      # backend, which shares the sandbox network. See the profile for
      # what it deliberately does not deny, and why.
      - "seccomp=./sandbox/policies/seccomp.json"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  pgdata:
  uploads:
  redisdata:

networks:
  internal:
  sandbox-net:
    internal: true
