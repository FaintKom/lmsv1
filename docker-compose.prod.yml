services:
  db:
    # pgvector/pgvector:pg16 is a drop-in replacement for postgres:16-alpine
    # (same PGDATA layout) that ships the `vector` extension's shared lib.
    # The DB has the `vector` extension + vector indexes (knowledge module);
    # plain postgres:16-alpine lacks vector.so, which breaks pg_dump (the
    # nightly backup silently failed for weeks). Keep this image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    # Built in CI (deploy.yml) and pulled from GHCR; `build:` kept only as
    # the transitional/manual fallback — the box must not build routinely.
    image: ghcr.io/faintkom/lmsv1-backend:latest
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms}
      SANDBOX_URL: http://sandbox:8001
      # Rate limiter persists counters in Redis so a redeploy doesn't
      # reset them. See app/common/rate_limit.py.
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    networks:
      - internal
      - sandbox-net
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  frontend:
    image: ghcr.io/faintkom/lmsv1-frontend:latest
    build: ./frontend
    networks:
      - internal
    restart: unless-stopped

  sandbox:
    image: ghcr.io/faintkom/lmsv1-sandbox:latest
    build: ./sandbox
    command: uvicorn runner.main:app --host 0.0.0.0 --port 8001
    # Egress-isolated network (internal: true) so untrusted student code
    # cannot reach the internet to exfiltrate data or phone home. Only the
    # backend (which also joins sandbox-net) can call it.
    networks:
      - sandbox-net
    deploy:
      resources:
        limits:
          # A fork bomb is three lines and needs no skill. Without this cap it
          # exhausted the container's memory by sheer process count and the kernel
          # OOM-killed the container itself (exit 137) — measured, not assumed.
          #
          # 256 is arithmetic, not a round number: one Java program costs ~13 threads
          # (measured, research.md Finding G), four slots is the production bound, and
          # the runner rests at 6 — so the worst legitimate case is about 58. Four
          # times that leaves room for a language nobody has profiled yet, while a
          # fork bomb reaches thousands within a second.
          pids: 256
          cpus: "2.0"
          memory: 512M
    # PID 1 here is uvicorn, and uvicorn does not reap orphans. A fork bomb's
    # children are re-parented to it when their own parent dies, and a killed
    # orphan stays a zombie — still occupying a slot in the pids cgroup.
    #
    # Measured: after one fork bomb the container held 256 pids while `docker
    # top` showed a single live process, and every later submission was refused
    # for a limit somebody else had reached. pids_limit alone therefore turns
    # "the container dies" into "the container refuses everything forever",
    # which is not much of an improvement. Docker's init (tini) reaps them.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=100M
      # The one directory that permits execution: a binary our own compiler
      # just produced from the pupil's source. /tmp stays noexec, so four of
      # the five languages never gain the permission (research.md Finding A).
      # mode=1777 because the service no longer runs as root: the default
      # 755 root-owned mount left `runner` unable to write here, which is
      # where compiled languages put their binary. Sticky, like /tmp, so
      # one of the concurrent executions cannot delete another's directory.
      - /sandbox-exec:size=64M,exec,mode=1777
    security_opt:
      - "no-new-privileges:true"
      # Denies outbound connect() to every process in the container. The
      # runner never dials out; a pupil's program needs it to reach the
      # backend, which shares the sandbox network. See the profile for
      # what it deliberately does not deny, and why.
      - "seccomp=./sandbox/policies/seccomp.json"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # A `ports:` line without a `127.0.0.1:` prefix means "on the public
    # internet", and nginx is the only service here that has earned one.
    #
    # ufw will not save you from getting this wrong. It filters the INPUT
    # chain — traffic addressed to the host — while a published container
    # port is DNAT'd in nat/PREROUTING and then travels the FORWARD chain,
    # which Docker has already opened. `ufw status` keeps reporting 22/80/443
    # either way, so the mistake stays invisible exactly where somebody would
    # look for it. Measured 2026-08-17: an unrelated container published
    # 0.0.0.0:2567 and was reachable from the internet with ufw active.
    #
    # To reach a service from your laptop, bind it to loopback and use an SSH
    # tunnel — never publish it:
    #     ports: ["127.0.0.1:5432:5432"]
    # db, redis, backend and sandbox deliberately publish nothing; they are
    # reachable only over the internal Docker networks.
    ports:
      - "80:80"
      - "443:443"
    command: ["nginx", "-c", "/etc/nginx/main/nginx.conf", "-g", "daemon off;"]
    volumes:
      # The directory, not the file. `deploy.yml` runs `git reset --hard`, which
      # replaces a changed file with a **new inode**; a single-file bind mount
      # keeps pointing at the old one, so the container goes on serving the
      # config it started with. Every nginx.conf change delivered by a deploy
      # had been landing on disk and not in nginx, invisibly, until something
      # recreated the container — at which point weeks of accumulated edits
      # arrive at once. One of them was a duplicate `location` that stopped
      # nginx and took the site down on 2026-08-17.
      #
      # A directory mount survives the swap: the directory keeps its inode when
      # a file inside it is replaced.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Loaded by the `command` above. It exists because `stream {}` must sit at
      # the top level and the image's own nginx.conf includes conf.d from inside
      # `http {}` — see nginx/main/nginx.conf.
      - ./nginx/main:/etc/nginx/main:ro
      - ./nginx/stream.d:/etc/nginx/stream.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
    restart: unless-stopped

  livekit:
    # Pinned to a version tag, and this is not a style preference. `deploy.yml`
    # pulls `backend`, `frontend` and `sandbox` by name and then runs
    # `docker compose up -d`, which recreates only services whose image or
    # definition changed. A pinned tag therefore means an ordinary deploy walks
    # straight past this container and a lesson in progress never notices.
    # `cloudflared` below uses `:latest`; copying that habit here would mean a
    # silent restart on any day the upstream image moved (research.md Finding I).
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit/livekit.yaml
    volumes:
      # The directory, not the file — same reason as nginx below. `git reset
      # --hard` gives a changed file a new inode and a single-file mount keeps
      # serving the old one, so a config edit lands on disk and never reaches
      # the process. This container is pinned and deliberately not recreated by
      # ordinary deploys, which would have made that invisible for weeks.
      - ./livekit:/etc/livekit:ro
    environment:
      # Real keys come from .env on the box and never enter git. The backend
      # signs its grants with the same pair.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    # Read the nginx comment below before touching this list. A published port
    # is DNAT'd in nat/PREROUTING and then travels FORWARD, which Docker has
    # already opened — ufw filters INPUT and will not stop it either way.
    #
    #   - 7880 carries signalling and is bound to loopback deliberately. nginx
    #     proxies /rtc to it over TLS; published publicly it would be an
    #     unauthenticated WebSocket on the open internet.
    #   - the rest carry media and must be reachable, which publishing achieves
    #     with no ufw change at all. Verify with `ss -lntup`, never with
    #     `ufw status`, which reports 22/80/443 whatever the truth is.
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882-7883:7882-7883/udp"
      - "3478:3478/udp"
      # TURN's relay allocations. 3478 carries only the control connection;
      # the relayed media leaves on one of these. Omitting them ships a TURN
      # server that answers and then relays nothing, which fails for exactly
      # the pupils it exists to serve (livekit.yaml explains the range).
      - "30000-30020:30000-30020/udp"
    deploy:
      resources:
        limits:
          # This box has 2 vCPU and about 2.4 GB free, measured 2026-08-17.
          # 1.2 leaves eight tenths of a core for PostgreSQL, FastAPI and
          # Next.js, which is the difference between a busy lesson and an
          # unreachable platform. It is a cap the media server may saturate
          # rather than a reservation, and slice 0 measures capacity *under*
          # it, because this is what production runs (research.md Finding F).
          cpus: "1.2"
          memory: 700M
    networks:
      - internal
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  pgdata:
  uploads:
  redisdata:

networks:
  internal:
  sandbox-net:
    internal: true
